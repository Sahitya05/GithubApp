<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div>
                    <h1 class="header-title">✨ Bucket List</h1>
                    <p class="header-subtitle">Dreams and goals to achieve</p>
                </div>
                <div class="header-buttons">
                    <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle between dark and light mode" aria-label="Toggle theme">
                        🌙
                    </button>
                    <button id="downloadBtn" class="download-btn" title="Download all goals as a text file">
                        ⬇️ Download
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <input
                        type="text"
                        id="goalInput"
                        class="goal-input"
                        placeholder="Add a new goal..."
                        aria-label="New goal input"
                    />
                    <select id="categorySelect" class="category-select" aria-label="Goal category">
                        <option value="Work">Work</option>
                        <option value="Personal" selected>Personal</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                    </select>
                    <input
                        type="date"
                        id="targetDateInput"
                        class="due-date-input"
                        aria-label="Goal target date (optional)"
                    />
                    <button id="addBtn" class="add-btn" aria-label="Add goal">
                        <span class="add-btn-text">Add Goal</span>
                    </button>
                </div>
            </section>

            <!-- Filter Section -->
            <section class="filter-section">
                <div>
                    <p class="filter-label">Status:</p>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">
                            All
                        </button>
                        <button class="filter-btn" data-filter="not-started">
                            Not Started
                        </button>
                        <button class="filter-btn" data-filter="achieved">
                            Achieved
                        </button>
                    </div>
                </div>
                <div>
                    <p class="filter-label">Category:</p>
                    <div class="category-filters">
                        <button class="category-filter-btn active" data-category="all">
                            All
                        </button>
                        <button class="category-filter-btn" data-category="Work">
                            💼 Work
                        </button>
                        <button class="category-filter-btn" data-category="Personal">
                            👤 Personal
                        </button>
                        <button class="category-filter-btn" data-category="Shopping">
                            🛒 Shopping
                        </button>
                        <button class="category-filter-btn" data-category="Health">
                            💪 Health
                        </button>
                    </div>
                </div>
                <div class="goal-counter">
                    <span id="goalCounter">0 of 0</span> achieved
                </div>
            </section>

            <!-- Search Bar Section -->
            <section class="search-section">
                <div class="search-input-wrapper">
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search goals..."
                        aria-label="Search goals"
                    />
                    <button id="clearSearchBtn" class="clear-search-btn" aria-label="Clear search" title="Clear search">
                        ✕
                    </button>
                </div>
            </section>

            <!-- Goal List Section -->
            <section class="task-section">
                <div id="goalList" class="task-list">
                    <!-- Goals will be rendered here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <p class="empty-state-icon">🎯</p>
                    <p class="empty-state-text">No goals yet! Add one to start your journey.</p>
                </div>
            </section>
        </main>

        <!-- Help Overlay Modal -->
        <div id="helpOverlay" class="help-overlay hidden">
            <div class="help-modal">
                <div class="help-header">
                    <h2>⌨️ Keyboard Shortcuts</h2>
                    <button id="closeHelpBtn" class="help-close-btn" aria-label="Close help">✕</button>
                </div>
                <div class="help-content">
                    <div class="shortcuts-list">
                        <div class="shortcut-item">
                            <div class="shortcut-key">Ctrl + N</div>
                            <div class="shortcut-desc">Focus new goal input</div>
                        </div>
                        <div class="shortcut-item">
                            <div class="shortcut-key">Ctrl + F</div>
                            <div class="shortcut-desc">Focus search input</div>
                        </div>
                        <div class="shortcut-item">
                            <div class="shortcut-key">Escape</div>
                            <div class="shortcut-desc">Clear filters and search</div>
                        </div>
                        <div class="shortcut-item">
                            <div class="shortcut-key">?</div>
                            <div class="shortcut-desc">Show this help overlay</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
